# Override SOLO para desarrollo local.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# En el compose base db y backend son INTERNOS (para no colisionar puertos en la Pi).
# Acá los volvemos a publicar en el host para poder inspeccionarlos/consumirlos en local
# (p.ej. correr el frontend con `npm run dev` apuntando a localhost:3000, o abrir la DB).
#
# Prisma Studio NO tiene autenticación y da acceso total a la base multi-tenant. Por eso
# vive únicamente acá y NUNCA debe agregarse al compose de producción.

services:
  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "3000:3000"

  prisma-studio:
    build:
      context: ./BackConcesionaria
      dockerfile: Dockerfile
    container_name: autenza-prisma-studio
    restart: "no"
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-concesionaria}?sslmode=disable
    command: npx prisma studio --port 5555 --browser none
    depends_on:
      - db
